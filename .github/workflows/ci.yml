name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run in flight pointless, so stop it
# and save the ten jobs.
#
# Pushes to main get a group of their own, keyed on the run, so they never
# queue behind each other. Sharing a group would not have been enough:
# cancel-in-progress protects the run that is executing, but a group holds
# only one run waiting behind it, so a third push evicts the second, and that
# commit would be reported as cancelled without ever being built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Belt and braces: with a group per run, pushes have nothing to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Run every combination even after one fails, so a single broken pairing
      # does not hide what the others would have said.
      fail-fast: false
      matrix:
        # Every supported Java version on Linux, where jobs are cheapest.
        os: [ubuntu-latest]
        java: ['21', '22', '23', '24', '25', '26', '27']
        # Windows and macOS only at the ends of that range. A problem with a
        # particular operating system shows up on any version, so the versions
        # in between would say nothing the ends do not.
        include:
          - os: windows-latest
            java: '21'
          - os: windows-latest
            java: '27'
          - os: macos-latest
            java: '21'
          - os: macos-latest
            java: '27'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to stay behind in
          # .git/config where the build it is about to run could read it.
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The build targets Java 21 whichever version compiles it, so what this
      # matrix checks is that the result still runs on later ones.
      - run: mvn --batch-mode --no-transfer-progress verify

      # A parity failure is the signal this repository exists to catch, and the
      # log alone does not say which bytes differed. Keep the reports.
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-${{ matrix.os }}-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a version and a checksum rather than an action, so what runs
      # here is the release that was checked, not whatever the tag points at.
      # actionlint also runs shellcheck over every run: block, which the runners
      # already have installed.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location --fail --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "$archive" actionlint
          ./actionlint -color

  # Correctness in this repository is defined by cardutil, so the check that
  # the generated files and the command line still match it belongs in the
  # gate rather than off to one side. Pinned, not newest: see the comment in
  # cardutil-parity.yml. It runs unconditionally, which costs about a minute
  # and means the job never reports as skipped.
  parity:
    name: cardutil parity
    permissions:
      contents: read
    uses: ./.github/workflows/cardutil-parity.yml
    with:
      cardutil-version: pinned

  required:
    name: Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build, workflows, parity]
    permissions: {}
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
