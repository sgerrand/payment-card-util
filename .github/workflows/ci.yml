name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      # Run every version even after one fails, so a single broken release does
      # not hide what the others would have said.
      fail-fast: false
      matrix:
        java: ['21', '22', '23', '24', '25', '26']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The build targets Java 21 whichever version compiles it, so what this
      # matrix checks is that the result still runs on later ones.
      - run: mvn --batch-mode verify
