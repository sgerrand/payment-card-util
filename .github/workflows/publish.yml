name: Publish

# Publishing a GitHub Release sends the library to Maven Central.
#
# The release itself is cut by release.yml. That workflow signs its work with a
# GitHub App token rather than the built in one, which is what allows the
# release it creates to start this workflow; a release created with the default
# token would not.
#
# What goes out is permanent. Maven Central never lets a version be replaced or
# withdrawn, and autoPublish below means no one is asked to confirm, so the
# version is checked against the release tag before anything is sent.

on:
  release:
    types: [published]

# Set per job below: publishing needs only to read the repository, while
# attaching the tools to the release needs to write to it.
permissions: {}

# Never let two releases publish at once.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the version matches the release tag
        run: |
          tag='${{ github.event.release.tag_name }}'
          expected="${tag#v}"
          actual=$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)

          echo "Release tag: $tag"
          echo "Project version: $actual"

          case "$actual" in
            *-SNAPSHOT)
              echo "::error::Refusing to publish a snapshot version ($actual)."
              exit 1
              ;;
          esac

          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag $tag expects version $expected, but the project says $actual."
            exit 1
          fi

      # Only the library and the parent it inherits from. The parent has to go
      # too, or nothing can resolve the library. The command line tools are not
      # published: the shaded jar bundles picocli and Jackson, and is meant to be
      # downloaded and run rather than depended on.
      - name: Publish
        run: >
          mvn --batch-mode --no-transfer-progress
          -Prelease
          -pl .,core
          -DautoPublish=true
          -DwaitUntil=published
          deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Say where it went
        run: |
          version='${{ github.event.release.tag_name }}'
          {
            echo "## Published"
            echo ""
            echo "\`com.sgerrand:payment-card-util:${version#v}\` is on Maven Central."
            echo ""
            echo "It may take a few minutes to appear in search."
          } >> "$GITHUB_STEP_SUMMARY"

  # The command line tools are not published to Maven Central: the jar carries
  # its dependencies inside it, and is meant to be downloaded and run rather
  # than depended on. So the release is where people get it from.
  #
  # A separate job, so that it neither needs the publishing credentials nor
  # lends its write access to them, and so the tools still reach the release if
  # publishing to Central fails.
  attach-tools:
    name: Attach the command line tools
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: maven

      - name: Build the tools
        run: mvn --batch-mode --no-transfer-progress package

      - name: Attach the jar to the release
        run: |
          tag='${{ github.event.release.tag_name }}'
          version="${tag#v}"
          jar="cli/target/payment-card-util-cli-${version}-all.jar"

          if [ ! -f "$jar" ]; then
            echo "::error::Expected $jar, but the build did not produce it."
            ls -1 cli/target/*.jar || true
            exit 1
          fi

          # A checksum beside it, so a download can be checked.
          sha256sum "$jar" | awk '{print $1}' > "$jar.sha256"

          gh release upload "$tag" "$jar" "$jar.sha256" --clobber

          {
            echo "## Command line tools"
            echo ""
            echo "\`$(basename "$jar")\` is attached to the $tag release."
            echo ""
            echo "\`\`\`sh"
            echo "java -jar $(basename "$jar") --help"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
