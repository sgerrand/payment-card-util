name: Release

# Release Please watches conventional commits on main and keeps a release pull
# request up to date. Merging that pull request tags the release and publishes
# the GitHub Release. Versions in every pom.xml are updated for us.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    uses: release-mate/action/.github/workflows/release-please.yml@ab5434d252b3c7e7fd57abe6a2e611f04c25213b # v1.2.0
    secrets:
      client-id: ${{ secrets.RELEASE_MATE_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_MATE_PRIVATE_KEY }}
