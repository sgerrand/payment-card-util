name: cardutil drift

# Asks one question weekly: has a new cardutil release moved anything?
#
# Deliberately not part of the Required gate. A new release landing is not a
# fault in the change under review, and blocking every pull request until the
# port catches up would punish work that has nothing to do with it. The same
# checks run against the pinned version on every pull request, from ci.yml.
#
# Note that GitHub stops running scheduled workflows after 60 days without
# activity in the repository.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check against the newest release
    permissions:
      contents: read
    uses: ./.github/workflows/cardutil-parity.yml
    with:
      cardutil-version: latest
