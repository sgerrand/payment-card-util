name: cardutil drift

# The parity tests compare this library against files generated by the Python
# cardutil package. Those files are committed, so they only tell us about the
# cardutil release they were generated from.
#
# This job installs the newest cardutil, regenerates both generated files, and
# fails if anything changed. A change means cardutil has moved and this port
# needs looking at.

on:
  schedule:
    # Mondays, early. Nothing here depends on the time of day.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Listed twice on purpose: GitHub Actions does not expand YAML anchors.
  push:
    paths:
      - 'tools/**'
      - 'core/src/main/java/com/sgerrand/paymentcardutil/config/DefaultConfig.java'
      - 'core/src/test/resources/vectors/cardutil.json'
      - '.github/workflows/cardutil-drift.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'core/src/main/java/com/sgerrand/paymentcardutil/config/DefaultConfig.java'
      - 'core/src/test/resources/vectors/cardutil.json'
      - '.github/workflows/cardutil-drift.yml'

permissions:
  contents: read

env:
  CONFIG_FILE: core/src/main/java/com/sgerrand/paymentcardutil/config/DefaultConfig.java
  VECTORS_FILE: core/src/test/resources/vectors/cardutil.json

jobs:
  drift:
    name: Check against the newest cardutil
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install the newest cardutil
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'cardutil[crypto]'

      - name: Record which version we got
        id: cardutil
        run: |
          version=$(python -c 'import cardutil; print(cardutil.__version__)')
          recorded=$(python -c "import json; print(json.load(open('$VECTORS_FILE'))['cardutil_version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "recorded=$recorded" >> "$GITHUB_OUTPUT"
          {
            echo "## cardutil versions"
            echo ""
            echo "| | Version |"
            echo "| --- | --- |"
            echo "| Installed now | \`$version\` |"
            echo "| Committed vectors built from | \`$recorded\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the config and the vectors
        run: |
          python tools/gen_config.py "$CONFIG_FILE"
          python tools/gen_vectors.py "$VECTORS_FILE"

      - name: Run the tests against whatever was just generated
        id: tests
        run: mvn --batch-mode verify

      - name: Fail if the generated files moved
        if: always()
        run: |
          if git diff --quiet -- "$CONFIG_FILE" "$VECTORS_FILE"; then
            echo "No drift: cardutil ${{ steps.cardutil.outputs.version }} generates the committed files."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No drift. The committed files still match." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::cardutil ${{ steps.cardutil.outputs.version }} no longer generates the committed files."
          {
            echo ""
            echo "## Drift found"
            echo ""
            echo "The committed files were built from cardutil"
            echo "\`${{ steps.cardutil.outputs.recorded }}\`, and no longer match what"
            echo "\`${{ steps.cardutil.outputs.version }}\` produces."
            echo ""
            echo "The test step above says whether this port still agrees with the new"
            echo "release: if it passed, the change is cosmetic and the files can be"
            echo "regenerated and committed. If it failed, cardutil has changed behaviour"
            echo "and the port needs updating to match."
            echo ""
            echo "<details><summary>What changed</summary>"
            echo ""
            echo '```diff'
            git diff --stat -- "$CONFIG_FILE" "$VECTORS_FILE"
            echo ""
            git diff -- "$CONFIG_FILE" "$VECTORS_FILE" | head -300
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          git --no-pager diff --stat -- "$CONFIG_FILE" "$VECTORS_FILE"
          git --no-pager diff -- "$CONFIG_FILE" "$VECTORS_FILE" | head -300
          exit 1

      - name: Keep the regenerated files for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-from-cardutil-${{ steps.cardutil.outputs.version }}
          path: |
            ${{ env.CONFIG_FILE }}
            ${{ env.VECTORS_FILE }}
          if-no-files-found: error
