name: cardutil drift

# Asks one question weekly: has a new cardutil release moved anything?
#
# Deliberately not part of the Required gate. A new release landing is not a
# fault in the change under review, and blocking every pull request until the
# port catches up would punish work that has nothing to do with it. The same
# checks run against the pinned version on every pull request, from ci.yml.
#
# Nobody watches a weekly run, so a failure opens an issue. Without that the
# only trace is a red mark in the Actions tab, and a new cardutil release could
# sit unnoticed for months.
#
# Note that GitHub stops running scheduled workflows after 60 days without
# activity in the repository.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check against the newest release
    permissions:
      contents: read
    uses: ./.github/workflows/cardutil-parity.yml
    with:
      cardutil-version: latest

  # Only for the scheduled run. A failure on a manual run already has someone
  # looking at it, and does not need an issue filing itself.
  report:
    name: Open an issue about the failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    if: always() && needs.check.result == 'failure' && github.event_name == 'schedule'
    permissions:
      issues: write

    steps:
      - name: Open or find the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: cardutil-drift
          VERSION: ${{ needs.check.outputs.cardutil-version }}
          RECORDED: ${{ needs.check.outputs.recorded-version }}
          TESTS: ${{ needs.check.outputs.tests }}
          CLI_OPTIONS: ${{ needs.check.outputs.cli-options }}
          CLI_COMPARED: ${{ needs.check.outputs.cli-options-compared }}
          GENERATED: ${{ needs.check.outputs.generated-files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Empty if the job fell over before it got as far as installing.
          version="${VERSION:-unknown}"
          title="cardutil $version: the weekly check failed"

          # The label is what makes these findable, and it does not exist until
          # the first failure. --force updates one that is already there rather
          # than failing, so any error left is a real one and stops the job.
          gh label create "$LABEL" \
            --description 'The weekly check against the newest cardutil release failed' \
            --color BFD4F2 --force

          # One issue per cardutil version, so an unaddressed drift does not
          # file a fresh report every Monday, while a later release still gets
          # its own.
          existing=$(gh issue list --label "$LABEL" --state open --json number,title \
            | jq --arg t "$title" --raw-output \
              'map(select(.title == $t)) | first | .number // empty')

          if [ -n "$existing" ]; then
            echo "Already tracked in #$existing."
            {
              echo "## Already reported"
              echo ""
              echo "This failure is tracked in #$existing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # What a human has to do next depends on which check failed, so say
          # so rather than making them open the run to find out.
          #
          # Each paragraph claims only what the outcomes prove. A step that was
          # skipped or cancelled is not a pass, so nothing is read into any of
          # them unless all three ran. If a generator falls over half way, the
          # files have moved and the tests never ran, and calling that cosmetic
          # would invite someone to commit half a regeneration. And one failure
          # does not rule out another, so the generated files and the command
          # line get a paragraph each.
          ran_all=true
          for outcome in "$TESTS" "$GENERATED" "$CLI_OPTIONS"; do
            case "$outcome" in
              success | failure) ;;
              *) ran_all=false ;;
            esac
          done

          # The command line step fails if the jar will not build or the script
          # falls over, as well as when the options differ. Only the last of
          # those is a finding about the options.
          cli=fine
          if [ "$CLI_OPTIONS" = failure ]; then
            if [ "${CLI_COMPARED:-}" = true ]; then
              cli=differs
            else
              cli=unfinished
            fi
          fi

          verdict=()
          if [ "$ran_all" = false ]; then
            verdict+=('Not every check ran to the end, so the results above do not say what went wrong. A check that did not run has not passed: do not regenerate and commit on the strength of this. The run log says where the job fell over.')
          else
            case "$TESTS/$GENERATED" in
              success/failure)
                verdict+=('The generated files moved and the tests passed against the new ones, so that change looks cosmetic. Regenerating both files and committing the result is probably all it needs.')
                ;;
              failure/failure)
                verdict+=('The generated files moved and the tests failed against the new ones, so cardutil has changed behaviour and this port needs updating to match. Do not simply regenerate and commit.')
                ;;
              failure/success)
                verdict+=('The tests failed although the generated files still match, so the new release is not the cause: the tests fail against what is already committed. The run log says which.')
                ;;
            esac

            case "$cli" in
              differs)
                verdict+=('The command line differs: cardutil has an option this port does not, or the other way round. Either add it, or record the divergence in the README and in EXPECTED_EXTRA in tools/check_cli_options.py.')
                ;;
              unfinished)
                verdict+=('The command line check failed before it had compared anything, so it says nothing about the options either way. Either the jar would not build or the script fell over. The run log says which.')
                ;;
            esac

            if [ "${#verdict[@]}" -eq 0 ]; then
              verdict+=('None of the three checks reported a failure of its own, so the job fell over somewhere else. The run log says where.')
            fi
          fi

          # The diff only exists if the files moved, and the attached files
          # are only a full regeneration if every step ran.
          if [ "$GENERATED" != failure ]; then
            run_has="[The run]($RUN_URL) has the log."
          elif [ "$ran_all" = true ]; then
            run_has="[The run]($RUN_URL) has the diff, and the regenerated files attached."
          else
            run_has="[The run]($RUN_URL) has the log. The files attached to it may be only partly regenerated, so do not commit them."
          fi

          body=$(mktemp)
          {
            echo "The weekly check against the newest cardutil release failed."
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Newest release | \`$version\` |"
            echo "| Committed vectors built from | \`${RECORDED:-unknown}\` |"
            echo "| Tests | ${TESTS:-unknown} |"
            echo "| Generated files | ${GENERATED:-unknown} |"
            echo "| Command line options | ${CLI_OPTIONS:-unknown} |"
            echo ""
            for paragraph in "${verdict[@]}"; do
              echo "$paragraph"
              echo ""
            done
            echo "$run_has"
            echo ""
            echo "Pull requests are unaffected: they are checked against \`${RECORDED:-the pinned version}\`, not against the newest release."
          } > "$body"

          number=$(gh issue create --title "$title" --label "$LABEL" --body-file "$body" \
            | tee /dev/stderr | grep --only-matching '[0-9]*$')

          {
            echo "## Reported"
            echo ""
            echo "Opened #$number."
          } >> "$GITHUB_STEP_SUMMARY"
