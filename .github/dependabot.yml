# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  # Every dependency and plugin version lives in the root pom.xml; the modules
  # under it declare only their parent and inherit the rest, so there is nothing
  # to update in core/ or cli/.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      # Split by type so each pull request gets the prefix that fits it:
      # build for what ships, chore for what only the tests use. Grouped
      # together, a week that bumped both would have to pick one.
      maven-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
      maven-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
